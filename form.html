<html>
    <head>
        <title>college form</title>
        <style>
            label{
                color: black
                font-size: 20px;
                font-family:Arail;
            }
            input{
                background-color: white;
            }
            body{
                background-color:darkmagenta;
            }
        </style>
    </head>
    <body>
        <form>
            <label>first name</label>
            <input type="text"
            name="first name"
            placeholder="Enter your first name"
            required>
            <br/>
            <label>last name</label>
            <input
            type="text"
            name="last name"
            placeholder="Enter your last name"
            required>
            <br/>
            <label>Email</label>
            <input 
            type="email"
            name="Email"
            placeholder="Enter your Email"
            required>
            <br/>
            <label>mark</label>
            <input 
            type="number"
            name="mark"
            placeholder="Enter your mark"
            required>
            <br/>
            <label>contact</label>
            <input
            type="tel"
            name="contact"
            placeholder="enter your contact number"
            required/>
            <br/>
            
            <label>maf date</label>
            <input
            type="date"
            name="mfdate"
            min="2026-08-06"
            max="2026-08-06"
            required/>
        
            
            <input type="submit" value="submit"/>
        </form>
    </body>
</html>
